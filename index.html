<!DOCTYPE html>
<html lang="zh-Hant"><head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9A%82%3C/text%3E%3C/svg%3E"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>詞彙特快車</title>
<style>
:root{--sky:#dcf0f7;--ink:#1f3a4d;--rail:#6b4f3a;--red:#d6453d;--sun:#f6c744;--leaf:#2f8f5b;--card:#fff;--line:#c9dbe4}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;color:var(--ink);background:#f3f8fa;display:flex;flex-direction:column}
nav{display:flex;gap:8px;padding:6px 10px;background:var(--ink)}
nav{overflow-x:auto}nav button{white-space:nowrap}
nav button{background:none;border:0;color:#cfe3ec;font:inherit;padding:6px 14px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--sun);color:var(--ink);font-weight:700}
button{font:inherit;cursor:pointer}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:8px 14px}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.red{background:var(--red)}.btn.go{background:var(--leaf)}
#stu{flex:1;display:flex;flex-direction:column;min-height:0}
#scene{position:relative;height:30vh;min-height:170px;background:linear-gradient(#cfe9f5 62%,#a8d5a0 62%);overflow:hidden;--t:clamp(26px,5.2vh,46px)}
#prog{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:clamp(16px,2.6vw,24px);z-index:3;text-shadow:0 1px 0 #fff;pointer-events:none}
.jp{width:min(640px,94%);margin:0 auto;background:#ffffffe0;border:2px solid var(--line);border-radius:12px;padding:2px 10px 3px;font-size:clamp(12px,1.9vw,16px);text-shadow:none;line-height:1.35}
.jt{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}.jb{display:flex;align-items:center;gap:6px}.jb small{font-weight:700}
.jtrack{position:relative;flex:1;height:10px;background:#dfe9ee;border-radius:6px;margin:12px 10px 6px}
#jf{position:absolute;left:0;top:0;bottom:0;background:var(--leaf);border-radius:6px;transition:width 1s ease-in-out}
.jtrack u{position:absolute;top:0;width:10px;height:10px;margin-left:-5px;background:#fff;border:2px solid #8fa0aa;border-radius:50%;box-sizing:border-box}
#jv{position:absolute;top:-17px;transform:translateX(-50%);font-size:22px;transition:left 1s ease-in-out;line-height:1}
.jl{text-align:center;font-weight:700;color:#2f6fe4}.tk .jl{display:none}.tk .jp{padding:1px 8px}
body.noanim #jf,body.noanim #jv{transition:none}
#strip{position:absolute;left:0;top:0;bottom:0;transition:transform 1.1s ease-in-out;will-change:transform}
#rail{position:absolute;left:0;right:0;bottom:16%;height:7px;background:repeating-linear-gradient(90deg,var(--rail) 0 14px,#8a6a50 14px 18px);border-radius:3px}
#rail2{position:absolute;left:0;right:0;bottom:calc(16% + 9px);height:3px;background:#555}
.bg1{position:absolute;bottom:38%;font-size:calc(var(--t)*1.3);opacity:.85}
.labar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#eee;min-width:120px;max-width:420px}.labar i{display:block;height:100%}.lat{width:100%;border-collapse:collapse;font-size:.92em}.lat th,.lat td{border-bottom:1px solid #e3e6ea;padding:3px 6px;text-align:left}
.stn{position:absolute;bottom:calc(16% + 7px);text-align:center;transition:filter .4s}
.stn .pl{height:calc(var(--t)*.35);background:#9aa5ad;border-radius:4px 4px 0 0;margin-top:2px}
.stn .sb{display:inline-block;background:#fff;border:3px solid #7d8b95;border-radius:8px;padding:1px 10px;font-weight:700;font-size:clamp(13px,2.2vh,18px);color:#6a7882;margin-bottom:calc(var(--t)*1.05)}
.stn .sb{max-width:100%;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stn.lit .sb{background:#ffe27a;border-color:#e0a800;color:#4a3500;box-shadow:0 0 14px #ffd54a;animation:lit 1.2s ease-out}
@keyframes lit{from{transform:scale(.8)}60%{transform:scale(1.15)}to{transform:scale(1)}}
#train{position:absolute;bottom:calc(16% + 9px);display:flex;gap:4px;transition:left 1.1s ease-in-out;z-index:2}
#train.arr{transition:left 1.5s cubic-bezier(.15,.75,.3,1)}
.car{position:relative;width:calc(var(--t)*1.9);height:var(--t);background:#d6453d;border-radius:7px;border-bottom:4px solid #9b2c26}
.car:nth-child(n+2){background:#3b78c4;border-bottom-color:#27568f}
.car.eng{width:calc(var(--t)*2.1);background:#2a3d4a;border-bottom-color:#16222a}
.car.eng:before{content:'';position:absolute;left:12%;top:-45%;width:18%;height:50%;background:#2a3d4a;border-radius:3px 3px 0 0}
.car.eng:after{content:'';position:absolute;right:6%;top:18%;width:22%;height:36%;background:#ffe9a8;border-radius:3px}
.car:nth-child(n+2):after{content:'';position:absolute;left:12%;right:12%;top:20%;height:34%;background:repeating-linear-gradient(90deg,#d8ecff 0 22%,transparent 22% 34%)}
.wh{position:absolute;bottom:-34%;width:calc(var(--t)*.5);height:calc(var(--t)*.5);border-radius:50%;background:conic-gradient(#222 0 12%,#aaa 12% 25%,#222 25% 37%,#aaa 37% 50%,#222 50% 62%,#aaa 62% 75%,#222 75% 87%,#aaa 87%);border:2px solid #111}
.wh{left:12%}.wh.w2{left:auto;right:12%}
#train.mv .wh{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#train.gold{filter:drop-shadow(0 0 10px #ffd54a)}
.star{z-index:4}
.wv{display:flex;align-items:center;justify-content:center;gap:6px;height:clamp(46px,8vh,70px)}
.wv i{display:block;width:clamp(10px,1.8vw,16px);height:8%;border-radius:8px;background:linear-gradient(#4aa3ff,#35c28a);transition:height .08s linear}
#wst{font-weight:700;color:#2f6fe4;min-height:1.4em}
.car.eng:after{box-shadow:0 0 calc(var(--gl,0)*24px) calc(var(--gl,0)*9px) rgba(255,226,130,.85)}
#train.wait .car.eng{animation:wt 1.4s ease-in-out 1}
@keyframes wt{50%{transform:translateY(-3px)}}
.toast{position:fixed;top:12%;left:50%;transform:translateX(-50%);background:#fff7d6;border:3px solid #e0a800;border-radius:14px;padding:10px 22px;font-weight:700;font-size:clamp(18px,3vw,28px);z-index:20;animation:tst 2.6s ease forwards}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-14px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.veh{font-size:44px;padding:10px;border:2px solid var(--line);border-radius:12px;background:#fff;text-align:center}.veh.lk{filter:grayscale(1);opacity:.35}.veh small{display:block;font-size:13px}
.star{position:absolute;font-size:28px;animation:up 1s ease-out forwards;pointer-events:none}
@keyframes up{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-70px) scale(1.4)}}
#mid{flex:1;display:flex;align-items:center;justify-content:center;gap:20px;padding:10px;min-height:0;flex-wrap:wrap}
#pic{height:100%;max-height:36vh;min-height:120px;aspect-ratio:4/3;max-width:90%;object-fit:cover;border-radius:16px;border:4px solid #fff;box-shadow:0 2px 10px #0003;background:#e6eef2}
#word{font-size:clamp(44px,9vw,96px);line-height:1.3;text-align:center}
ruby rt{font-size:.38em;color:#b8322b;font-weight:700;letter-spacing:1px}
#bot{padding:10px;background:#fff;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:8px;align-items:center}
#bot .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
#ans{font-size:clamp(28px,5vw,44px);width:min(420px,90%);text-align:center;padding:6px;border:3px solid var(--ink);border-radius:12px}
#ans.shake{animation:sh .4s;border-color:var(--sun)}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#msg{min-height:1.4em;font-weight:700;color:var(--leaf)}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9}
.box{background:#fff;border-radius:20px;padding:24px 30px;text-align:center;max-width:92%}
#tch{flex:1;overflow:auto;padding:12px;max-width:900px;width:100%;margin:0 auto}
.sub{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.sub button{border:2px solid var(--ink);background:#fff;border-radius:8px;padding:5px 12px}.sub button.on{background:var(--ink);color:#fff}
.panel{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.panel label{display:block;margin:8px 0 3px;font-weight:700}
.panel input[type=text],.panel input[type=number],.panel select{font:inherit;padding:6px;width:100%;max-width:420px;border:2px solid var(--line);border-radius:8px}
#cv{width:100%;max-width:400px;aspect-ratio:4/3;border:2px dashed var(--ink);touch-action:none;cursor:grab;border-radius:8px;background:#eee}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.c{border:2px solid var(--line);border-radius:10px;padding:6px;text-align:center;background:#fff}
.c img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px}
.c button{padding:3px 7px;margin:2px;font-size:13px}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:5px;text-align:center}
.hide{display:none!important}
.zs{display:inline-block;min-width:1.5em;margin:3px;padding:2px 8px;background:#e3e8eb;color:#6b7a85;border-radius:10px;border:4px solid transparent;font-weight:700;font-size:clamp(30px,6vw,56px);text-align:center}
.zs.ok{background:#2f6fe4;color:#fff}.zs.pop{animation:pop .5s}.zs.bad{border-color:#f59e0b;animation:sh .5s}
@keyframes pop{50%{transform:scale(1.3);box-shadow:0 0 18px #2f6fe4}}
#cap:focus{border-color:var(--leaf)!important}
#mid{overflow:auto}
.zs{display:block;width:100%;box-sizing:border-box;min-height:1.5em;margin:3px 0 0;padding:2px 0;font-size:clamp(22px,4vw,44px)}
.sr{display:flex;gap:4px;justify-content:center}.sc{display:flex;flex-direction:column;align-items:center;width:clamp(34px,6vw,62px)}
.dm{min-height:1.4em;line-height:1.4;font-size:clamp(20px,3.6vw,38px);color:#a67c00;font-weight:700;border-radius:10px}.dm:not(:empty){background:#fff3c4}.dm.hl{animation:dmhl 1.2s ease-out}.sps{font-size:.42em;white-space:nowrap;letter-spacing:0}
@keyframes dmhl{0%{background:#ffe27a;box-shadow:0 0 12px #ffd54a;transform:scale(1.15)}100%{background:#fff3c4;box-shadow:none;transform:scale(1)}}
.hzg .btn.dn{opacity:.55;pointer-events:none}
.ac{text-align:center}.gl{min-height:1.3em;min-width:1.1em;font-size:clamp(44px,8vw,92px);line-height:1.2}.gl.in{animation:gl .5s ease-out}
@keyframes gl{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
#ans-col{display:flex;flex-direction:column;align-items:center;gap:6px}
.hz{font-size:clamp(28px,5vw,52px)}.hy{font-size:clamp(20px,3.4vw,36px);color:#b8322b;font-weight:700;letter-spacing:2px}
#word.ans{display:flex;gap:clamp(10px,2.5vw,28px);font-size:inherit}
.tkr{display:flex;gap:5px;justify-content:center;margin:3px 0}
.tkb{width:clamp(34px,7.2vw,70px);height:clamp(36px,6.4vh,58px);font-size:clamp(18px,3vw,30px);border:2px solid var(--ink);border-radius:10px;background:#fff;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tkb:active{background:#cfe0ff}.tkb.tn{background:#eef6ff}
.tk #scene{height:20vh;min-height:100px;--t:clamp(20px,3.8vh,32px)}.tk #pic{max-height:18vh;min-height:80px}
@media (max-height:620px){#scene{height:20vh;min-height:100px}}
.catrow{display:flex;gap:6px;align-items:center;margin:4px 0;padding:4px;border-radius:12px;flex-wrap:wrap}.catrow.sel{background:#fff3c4;outline:3px solid #f0b400}.catrow label{padding:6px}.catrow input{width:24px;height:24px}
#scene{--sky:#cdeaf7;--gnd:#a6d58f;background:linear-gradient(var(--sky) 62%,var(--gnd) 62%)}
#scene[data-th=bike]{--sky:#cdeaf7;--gnd:#a6d58f}#scene[data-th=car]{--sky:#cfe3f4;--gnd:#a9b9a3}#scene[data-th=train]{--sky:#d6e6f2;--gnd:#9cc98e}#scene[data-th=hsr]{--sky:#c9e3f8;--gnd:#b2c7b0}#scene[data-th=plane]{background:linear-gradient(#78b4ec 0,#cfe8fb 62%,#8c98a3 62%)}
.lay{position:absolute;left:0;pointer-events:none;background-repeat:repeat-x;background-position:left bottom;will-change:transform;transition:transform 1.1s ease-in-out}
#train{transition:left 1.1s ease-in-out;display:block;--vb:9px;bottom:calc(16% + var(--vb))}
#train .vh{display:block;transition:transform .7s ease-in-out;transform-origin:50% 100%}
#scene[data-th=bike] #train{--vb:6px}#scene[data-th=car] #train{--vb:6px}#scene[data-th=plane] #train{--vb:2px}
.rot{transform-box:fill-box;transform-origin:center}
#train.mv .rot{animation:spin calc(var(--spd,1)*.4s) linear infinite}
.pd{transform-origin:52px 28px}#train.mv .pd{animation:pedal calc(var(--spd,1)*.8s) ease-in-out infinite alternate}
@keyframes pedal{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes rodm{0%{transform:translate(6px,0)}25%{transform:translate(0,6px)}50%{transform:translate(-6px,0)}75%{transform:translate(0,-6px)}100%{transform:translate(6px,0)}}
#train.mv .rod{animation:rodm calc(var(--spd,1)*.4s) linear infinite}
.smk circle{transform-box:fill-box;transform-origin:center;opacity:0;animation:puff 2.6s ease-out infinite}.smk circle:nth-child(2){animation-delay:.9s}.smk circle:nth-child(3){animation-delay:1.7s}
#train.mv .smk circle{animation-duration:1.5s}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:.85}100%{opacity:0;transform:translate(-22px,-40px) scale(2.3)}}
.beam{opacity:.22;transition:opacity .5s}#train.mv .beam,#train.boost .beam{opacity:.6}
.shine{transform:skewX(-22deg)}#train.mv .shine,#train.boost .shine{animation:shine 1.2s ease-in-out 1}
@keyframes shine{from{transform:skewX(-22deg) translateX(0)}to{transform:skewX(-22deg) translateX(560px)}}
#train .spl{position:absolute;right:100%;height:2px;width:calc(var(--t)*3.2);border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));opacity:0;transition:opacity .5s}#train.mv .spl,#train.boost .spl{opacity:.75}
#scene[data-th=hsr] #train .spl{background:linear-gradient(90deg,transparent,rgba(255,255,255,.95))}
#train.fly .vh{transform:translateY(calc(var(--t)*-1.5)) rotate(-3deg)}#train.fly.mv .vh{transform:translateY(calc(var(--t)*-1.6)) rotate(-7deg)}
#scene[data-th=bike] #rail{bottom:calc(16% - 2px);height:calc(var(--t)*.32);background:#c9a66b;border-radius:6px}#scene[data-th=bike] #rail2{display:none}
#scene[data-th=car] #rail{bottom:calc(16% - var(--t)*.25);height:calc(var(--t)*.8);background:#4b5056;border-radius:0}#scene[data-th=car] #rail:after{content:'';position:absolute;left:0;right:0;top:47%;height:4px;background:repeating-linear-gradient(90deg,#ffe27a 0 30px,transparent 30px 62px)}#scene[data-th=car] #rail2{display:none}
#scene[data-th=hsr] #rail{height:calc(var(--t)*.22);bottom:calc(16% + 2px);background:linear-gradient(#cfd6dc,#aab3bb);border-radius:3px}#scene[data-th=hsr] #rail:after{content:'';position:absolute;left:0;right:0;top:100%;height:calc(var(--t)*.5);background:repeating-linear-gradient(90deg,#9aa4ad 0 10px,transparent 10px 150px)}#scene[data-th=hsr] #rail2{display:none}
#scene[data-th=plane] #rail{bottom:calc(16% - var(--t)*.2);height:calc(var(--t)*.7);background:#6d7781;border-radius:0}#scene[data-th=plane] #rail:after{content:'';position:absolute;left:0;right:0;top:45%;height:3px;background:repeating-linear-gradient(90deg,#fff 0 26px,transparent 26px 56px)}#scene[data-th=plane] #rail2{display:none}
#mbd{position:absolute;left:8px;bottom:6px;background:#ffffffd9;border:2px solid var(--line);border-radius:10px;padding:2px 10px;font-weight:700;font-size:clamp(12px,1.8vw,16px);z-index:4;display:none}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;margin:6px 0}
.vc{background:#fff;border:3px solid var(--line);border-radius:18px;padding:8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);cursor:pointer;min-height:150px;font:inherit}
.vc.on{border-color:var(--sun);background:#fffbe6}.vc .ill{height:64px;display:flex;align-items:flex-end;justify-content:center;max-width:100%;overflow:hidden;padding-top:6px}
.vc b{font-size:20px}.vc .st{font-size:12px;color:#6a7882}.vc .go2{margin-top:auto;background:var(--leaf);color:#fff;border-radius:10px;padding:5px 14px;font-weight:700}
.cf{position:fixed;inset:0;overflow:hidden;pointer-events:none}.cf i{position:absolute;top:-30px;font-style:normal;font-size:26px;opacity:.9;animation:fall 6s linear infinite}@keyframes fall{to{transform:translateY(110vh) rotate(160deg)}}
@media (prefers-reduced-motion:reduce){#scene,#scene *,.cf i{animation:none!important;transition:none!important}.cf{display:none}}
body.noanim #scene,body.noanim #scene *{animation:none!important;transition:none!important}

/* ===== 第二階段：五種交通工具專屬動畫 =====
   原則：答題時只有輕微動態（座車微晃、煙霧、引擎）；答對後才出現前進、加速、速度線、地面流動。
   全部只用 transform／opacity／background-position（小面積）；離開遊戲、切到背景時停止。 */
@keyframes idl{50%{translate:0 -1.5px}}
@keyframes idlb{0%,100%{rotate:-.6deg}50%{rotate:.6deg}}
@keyframes trem{0%,100%{translate:0 0}50%{translate:0 .8px}}
@keyframes flt{50%{translate:0 -4px;rotate:.8deg}}
@keyframes bob{50%{translate:0 -2.5px}}
body.ig #train .vh{animation:idl 3.4s ease-in-out infinite}
body.ig #scene[data-th=bike] #train .vh{animation:idlb 2.8s ease-in-out infinite}
body.ig #scene[data-th=car] #train .vh{animation:trem .38s ease-in-out infinite}
body.ig #scene[data-th=train] #train .vh{animation:idlb 1.8s ease-in-out infinite}
body.ig #scene[data-th=hsr] #train .vh{animation:idl 5s ease-in-out infinite}
body.ig #scene[data-th=plane] #train .vh{animation:flt 3.2s ease-in-out infinite}
body.ig #scene[data-th=bike] #train.mv .vh,body.ig #scene[data-th=car] #train.mv .vh,body.ig #scene[data-th=train] #train.mv .vh{animation:bob calc(var(--spd,1)*.45s*var(--bs,1)) ease-in-out infinite}
body.ig #scene[data-th=hsr] #train.mv .vh{animation:none}
#scene.bst{--bs:.5}
#train.mv .rot{animation-duration:calc(var(--spd,1)*.4s*var(--bs,1))}#train.mv .pd{animation-duration:calc(var(--spd,1)*.8s*var(--bs,1))}#train.mv .rod{animation-duration:calc(var(--spd,1)*.4s*var(--bs,1))}
@keyframes flowbg{to{background-position-x:calc(var(--pd,60px)*-1)}}
#scene[data-th=train]{--pd:18px}#scene[data-th=car]{--pd:62px}#scene[data-th=plane]{--pd:56px}#scene[data-th=hsr]{--pd:150px}
#scene.fl #rail,#scene.fl #rail:after{animation:flowbg calc(.6s*var(--bs,1)) linear infinite}
.sl{position:absolute;left:100%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9));opacity:0;pointer-events:none;z-index:1}
#scene.fl .sl{opacity:.7;animation:slm calc(.7s*var(--bs,1)) linear infinite;animation-delay:var(--d,0s)}
@keyframes slm{from{transform:translateX(0)}to{transform:translateX(calc(-100vw - 400px))}}
#scene.sw{animation:swp .6s ease-out}@keyframes swp{from{opacity:.15}to{opacity:1}}
/* 車輛專屬：加速 */
.exh circle{fill:#cfd4d9;opacity:0;transform-box:fill-box;transform-origin:center}
#train.boost .exh circle{animation:exp .9s ease-out 2}.exh circle:nth-child(2){animation-delay:.12s}.exh circle:nth-child(3){animation-delay:.24s}
@keyframes exp{0%{opacity:.8;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-34px,-8px) scale(2)}}
#scene[data-th=car] #train.boost .vh{transform:rotate(-2deg) translateX(-3px)}
#scene[data-th=bike] #train.boost .vh{transform:rotate(-3deg) translateX(2px)}

/* ===== 網站內建教材（materials/）：開啟網頁時自動讀取，不需要匯入 ZIP =====

function packSync(force){const P=window.TH_PACK;if(!P||!Array.isArray(P.cards))return 0;if(!force&&S.packVer===P.ver)return 0;
 const first=!S.packVer,ids=new Set(P.cards.map(c=>c.id)),cids=new Set((P.cats||[]).map(c=>c.id));let n=0;
 const have=new Set(S.cards.map(c=>c.id)),haveK=new Set(S.cats.map(c=>c.id)),sn=S.packSnap||{};
 const goneC=force?new Set():new Set((S.packIds||[]).filter(id=>!have.has(id))),goneK=force?new Set():new Set((S.packCats||[]).filter(id=>!haveK.has(id)));
 (S.packIds||[]).forEach(id=>{const c=S.cards.find(x=>x.id===id);if(c&&!ids.has(id)&&(force||sigC(c)===sn[id])){S.cards=S.cards.filter(x=>x.id!==id);n++}});
 (S.packCats||[]).forEach(id=>{if(!cids.has(id))S.cats=S.cats.filter(c=>c.id!==id)});
 P.cards.forEach(p=>{if(goneC.has(p.id))return;const o={id:p.id,text:p.text,zy:p.zy||'',img:p.img||'',audio:p.audio||'',cats:(p.cats||[]).slice(),created:p.created||Date.now(),modified:p.modified||Date.now()},i=S.cards.findIndex(c=>c.id===p.id);
  if(i<0){S.cards.push(o);n++}else if(force||o.modified>=(S.cards[i].modified||0)){S.cards[i]=o;n++}});
 (P.cats||[]).forEach(p=>{if(goneK.has(p.id))return;let c=S.cats.find(x=>x.id===p.id);if(!c){c={id:p.id,name:p.name,order:[]};S.cats.push(c)}c.name=p.name;c.order=(p.order||[]).concat((c.order||[]).filter(x=>!(p.order||[]).includes(x)))});
 const all=new Set(S.cards.map(c=>c.id)),cs=new Set(S.cats.map(c=>c.id));S.cats.forEach(c=>c.order=(c.order||[]).filter(x=>all.has(x)));S.cards.forEach(c=>c.cats=(c.cats||[]).filter(x=>cs.has(x)));
 if((first||force)&&P.set)Object.assign(S.set,portableSet(P.set));if(S.set.musSrc==='project'&&!S.set.musPicked)S.set.musSrc='builtin';
 S.packVer=P.ver;S.packAt=P.updatedAt||'';S.packIds=[...ids];S.packCats=[...cids];S.packSnap=Object.fromEntries(P.cards.map(c=>[c.id,sigC(c)]));S.packKSnap=sigK(P.cats);return n}

 cur.forEach((c,id)=>{if(!(id in sn))add++;else if(sigC(c)!==sn[id])chg++});Object.keys(sn).forEach(id=>{if(!cur.has(id))del++});

 s.onload=()=>{clearTimeout(t);window.TH_PACK?ok(window.TH_PACK):no(new Error('教材檔案是空的'))};s.onerror=()=>{clearTimeout(t);no(new Error('找不到 materials/pack.js'))};s.src='materials/pack.js?t='+Date.now();document.head.appendChild(s)})}
async function packFetch(){const b='materials/',q=v=>'?v='+encodeURIComponent(v);
 const r=await fetch(b+'manifest.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('讀不到教材清單（HTTP '+r.status+'）');

 const info={version:m.version,updatedAt:m.updatedAt,n:m.counts&&m.counts.cards};if(S.packVer===m.version)return{same:true,info};
 const gj=async n=>{const x=await fetch(b+n+q(m.version),{cache:'no-cache'});if(!x.ok)throw new Error('讀不到 '+n+'（HTTP '+x.status+'）');return x.json()};
 const [cj,kj,sj]=await Promise.all([gj('cards.json'),gj('categories.json'),gj('settings.json').catch(()=>({portable:{}}))]);
 if(!Array.isArray(cj.cards)||!Array.isArray(kj.categories))throw new Error('教材檔案結構不正確');
 const cache={},getF=async p=>{if(!p)return'';if(!/^(images|audio)\/[\w.\-]+$/.test(p))throw new Error('不合法的檔案路徑：'+p);if(cache[p])return cache[p];
  const x=await fetch(b+p+q(m.version),{cache:'no-cache'});if(!x.ok)throw new Error('讀不到 '+p+'（HTTP '+x.status+'）');const u=new Uint8Array(await x.arrayBuffer()),i=(m.files||{})[p];

 const cs=cj.cards,out=new Array(cs.length);for(let i=0;i<cs.length;i+=6){PK.prog='載入圖片 '+Math.min(i+6,cs.length)+' / '+cs.length;pkUi();
  await Promise.all(cs.slice(i,i+6).map(async(c,k)=>{out[i+k]={id:c.id,text:c.text,zy:c.zy||'',img:await getF(c.image),audio:await getF(c.audio),cats:c.cats||[],created:c.created,modified:c.modified}}))}

const ZST=['聲母','介音','韻母','聲調'],INIS='ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ',FINS='ㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ';
/* 符號分類：0 聲母／1 介音／2 韻母／3 聲調。ㄧㄨㄩ 後面還接韻母時才是介音；單獨出現（衣、烏、魚）是韻母 */
function zyClass(tok,si){const x=tok[si];if(!isSym(x))return 3;if(INIS.includes(x))return 0;if(FINS.includes(x))return 2;return tok.slice(si+1).some(y=>FINS.includes(y))?1:2}

V2.cellsOf=(s)=>{const o=[];K.seq.forEach((tk,ci)=>{if(ci<K.ci)return;if(K.hrv.has(ci+':'+s))return;tk.forEach((x,si)=>{if(zyClass(tk,si)===s)o.push(ci+':'+si)})});return o};
V2.nextStage=()=>{if(!K||!K.seq||!K.hrv)return -1;for(let s=0;s<4;s++)if(V2.cellsOf(s).length)return s;return -1};
V2.hLab=t=>{const st=V2.nextStage();if(st<0)return '已完整提示';const u=V2.unit();if(t==='p')return '提示'+ZST[st]+(u?' −'+u+'⭐':'');return '完整注音'+(u?' −'+Math.max(0,K.hst.length?4*u-K.hcost:4*u)+'⭐':'')};
V2.hbRefresh=()=>{['p','f'].forEach(t=>{const b=document.getElementById('hb'+t);if(b){b.textContent='ㄅ '+V2.hLab(t);b.classList.toggle('dn',V2.nextStage()<0)}})};
V2.demo=(x,si,ci,tk)=>{if(S.set.mode==='key')return esc(x===' '?'':x);const s=zyClass(tk,si);if(!K.hrv||!K.hrv.has(ci+':'+s))return '';return x===' '?'<span class="sps">空白鍵</span>':esc(x)};
V2.hintPress=(t,o)=>{o=o||{};if(G.lock||!K||!K.seq||!K.seq.length)return;const hz=S.set.hz||{},st=V2.nextStage(),hcap=+((S.set.hl||{}).cap)||0;if(!o.auto&&!(S.set.hl||{})[t])return;if(hcap>0){if(K.hst.length>=hcap){V2.msg('已經提示過囉','#2f6fe4');return}if(t==='f')t='p'}

 if(!o.auto){if(hz.u==='off'&&!hz.free){V2.msg('老師目前沒有開放注音提示');return}
  if(!hz.free&&!V2.unlockOK()){V2.msg('先再聽一次試試看！');V2.flashRep();return}}
 if(G.hzBusy)return;
 const U=V2.unit(),cap=4*U;let cost=o.auto?0:(t==='p'?U:(K.hst.length?cap-K.hcost:cap));cost=Math.max(0,Math.min(cost,cap-K.hcost));
 const ded=Math.min(cost,Math.max(0,S.rw.stars)),direct=t==='f'&&!K.hst.length&&!o.auto;G.hzBusy=1;
 const reveal=()=>{G.hzBusy=0;if(!G.on||G.lock)return;K.hnew=new Set();
  const stages=t==='p'?[st]:[0,1,2,3].filter(s=>V2.cellsOf(s).length);
  stages.forEach(s=>{V2.cellsOf(s).forEach(k=>K.hnew.add(k));K.seq.forEach((tk,ci)=>{if(ci>=K.ci&&tk.some((x,si)=>zyClass(tk,si)===s))K.hrv.add(ci+':'+s)});if(!K.hst.includes(s))K.hst.push(s)});
  K.hcost+=cost;K.hded+=ded;K.hp=1;if(t==='f'){K.hf=1;K.hfull=1;if(direct)K.hdirect=1;G.h.f++}else G.h.p++;G.used.zy=true;K.hlog.push({t,stages:stages.map(s=>ZST[s]),cost,ded,auto:o.auto?1:0});RE.hint(t==='f'?(direct?'zy_full_direct':'zy_full'):'zy_stage',{stages:stages.map(s=>ZST[s]),cost,deducted:ded,auto:o.auto?1:0});
  showK();kBot();setTimeout(()=>{K.hnew=null},1400);foc()};

/* ==================== 第05階段：七大核心語言能力評量計算引擎（v5.0） ====================

const AS={SPEC:'1.0'};
AS.DEF={minN:5,minNWord:3,unk:'exclude',delayH:24,confMin:2,maxAnHint:2};
AS.RN={minN:'有效題數低於此值時顯示「資料不足」',minNWord:'單一詞彙的資料不足門檻',unk:'未標示用途的紀錄（exclude＝不計入評量；assess＝視為評量題）',delayH:'延宕提取：與同詞彙上一次作答至少相隔幾小時',confMin:'易混淆詞彙：同一組錯選至少幾次才列出',maxAnHint:'「無答案提示」可容許的最高提示等級（P1、P2 不含答案；P3 首音、P4 完整示範含答案線索）'};
AS.st=()=>{if(!S.as)S.as={ver:AS.SPEC+'.0',rules:{},log:[{ver:AS.SPEC+'.0',ts:Date.now(),by:'system',note:'初始規則集 '+AS.SPEC+'（程式內建）',changes:{},rules:{...AS.DEF}}],fix:{}};return S.as};

AS.ver=()=>(S.as&&S.as.ver)||(AS.SPEC+'.0');
/* 調整門檻＝新增一個規則版本（舊報告仍可由版本紀錄追溯） */
AS.setRules=(patch,by,note)=>{const a=AS.st(),cur=AS.rules(),ch={};
 Object.keys(patch||{}).forEach(k=>{if(!(k in AS.DEF))return;let v=patch[k];if(typeof AS.DEF[k]==='number')v=Math.max(1,Math.round(+v)||AS.DEF[k]);if(k==='unk')v=v==='assess'?'assess':'exclude';if(cur[k]!==v)ch[k]={from:cur[k],to:v}});

 const n=(+a.ver.split('.').pop()||0)+1;a.ver=AS.SPEC+'.'+n;a.log.push({ver:a.ver,ts:Date.now(),by:by||'teacher',note:note||'',changes:ch,rules:AS.rules()});save();return a.ver};

AS.fixSet=(rec,set,by,reason)=>{if(!rec||!rec.id)return false;const a=AS.st(),s={};
 if(set.outcome&&AS.FIXF.outcome.includes(set.outcome))s.outcome=set.outcome;if(set.purpose&&AS.FIXF.purpose.includes(set.purpose))s.purpose=set.purpose;if(set.exclude===true)s.exclude=true;if(typeof set.independent==='boolean')s.independent=set.independent;
 if(!Object.keys(s).length)return false;const L=a.fix[rec.id]=a.fix[rec.id]||[];
 L.push({id:'F'+Date.now().toString(36)+L.length,ts:Date.now(),by:by||'teacher',reason:reason||'',set:s,orig:{outcome:rec.outcome,purpose:rec.purpose||'unknown',independent:rec.independent===true},revoke:false});save();return true};

 const L=recs.filter(r=>r&&r.ts>=from&&r.ts<=to).map(r0=>AS.view(r0,fix)).sort((a,b)=>a.ts-b.ts);

{const _ok=PH.ok;PH.ok=function(c,m,sub){

  if(m==='speak'&&sub==='newimg')return P15.newImgs(c).length>0&&_ok.call(this,c,'speak','obj');

/*P20-BEGIN v21.0 統一教材存取層（MAT）、本次練習題庫快照（SNAP）、前臺學習設定重整。
  教材唯一來源＝S.cards／S.cats（教師後臺管理的正式教材；內建詞彙庫啟用後也由 LIB.sync 寫入同一處）。
  前臺分類選單、數量統計、系統推薦、複習、錯題集、遊戲派題都經由這裡，不另存分類清單或題庫。 */
const MAT={ver:0,_d:null,_k:'',bc:null,_t:0};
MAT.imgN=c=>c&&c.img?Math.max(1,(c.imgs||[]).length):0;
MAT.cards=()=>S.cards.filter(c=>!c.part);
MAT.bump=()=>{MAT.ver++;MAT._d=null};
/* 兩個獨立的分類維度：theme（主題）／level（分級）；以卡片實際所屬分類計算，名稱與數量不寫死 */
MAT.dims=()=>{const k=[S.cards.length,S.cats.length,MAT.ver,S.cats.map(c=>c.id).join(',').length].join('|');if(MAT._d&&MAT._k===k)return MAT._d;
 const by={};S.cards.forEach(c=>{if(c.part)return;(c.cats||[]).forEach(id=>{(by[id]=by[id]||[]).push(c)})});
 const mk=c=>{const a=by[c.id]||[];return{id:c.id,name:c.name,words:a.length,imgs:a.reduce((s,x)=>s+MAT.imgN(x),0),noimg:a.filter(x=>!x.img).length,sort:c.sort||0,lib:c.lib?1:0}};
 const th=S.cats.filter(c=>!c.lvl).map(mk).sort((a,b)=>(b.lib-a.lib)||(a.sort-b.sort)),lv=S.cats.filter(c=>c.lvl).map(mk).sort((a,b)=>a.sort-b.sort);
 const un=S.cards.filter(c=>!c.part&&!(c.cats||[]).some(id=>S.cats.some(k=>k.id===id)));if(un.length)th.push({id:'__none',name:'未分類',words:un.length,imgs:un.reduce((s0,x)=>s0+MAT.imgN(x),0),noimg:un.filter(x=>!x.img).length,sort:9999,lib:0});
 MAT._k=k;return MAT._d={theme:th,level:lv}};
MAT.sel=()=>{const m=FL.mem(),s=(SNAP.s&&SNAP.s.active&&SNAP.s.cats)||null;if(s)return s;const d=m.dim;return d==='theme'||d==='level'?((m.sel||{})[d]||[]):[]};
MAT.union=ids=>{const set=new Set(ids),seen=new Set(),out=[],catIds=new Set(S.cats.map(k=>k.id));S.cards.forEach(c=>{if(c.part||seen.has(c.id))return;if((c.cats||[]).some(k=>set.has(k))||(set.has('__none')&&!(c.cats||[]).some(k=>catIds.has(k)))){seen.add(c.id);out.push(c)}});return out};
MAT.selPool=()=>MAT.union(MAT.sel());
MAT.stat=ids=>{const a=MAT.union(ids);return{words:a.length,imgs:a.reduce((s,x)=>s+MAT.imgN(x),0)}};
MAT.special=()=>{const o=[{k:'mk',n:'錯題集',w:mistakeCards().length,d:'依學習紀錄產生：答錯或需要協助的詞彙'},{k:'wk',n:'注音加強練習',w:weakCards().length,d:'依最常按錯的注音符號產生'}];if(S.set.laIds&&S.set.laIds.length)o.push({k:'la',n:'分析推薦的詞彙',w:LA.pool().length,d:'教師從「學習分析」建立'});return o};
